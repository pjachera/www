<script>
const $=s=>document.querySelector(s),cv=$('#c'),ctx=cv.getContext('2d');
let W,H,DPR,ac=null,toy=null,last=0;
const S={heading:null,gt:9.8,gx:0,gy:9.8,ax:0,ay:0,az:0,mag:0,beta:0,gamma:0,rot:0,real:false};
function size(){DPR=Math.min(devicePixelRatio||1,3);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',size);size();
function show(id){document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id==id))}
// sensors
addEventListener('devicemotion',e=>{const g=e.accelerationIncludingGravity,a=e.acceleration,r=e.rotationRate;
 if(g&&g.x!=null){S.real=true;S.gt=Math.hypot(g.x,g.y,g.z);let o=(screen.orientation&&screen.orientation.angle)||window.orientation||0;let x=-g.x,y=g.y;
  if(o==90){[x,y]=[y,-x]}else if(o==-90||o==270){[x,y]=[-y,x]}S.gx=x;S.gy=y;}
 if(a&&a.x!=null)S.mag=Math.hypot(a.x,a.y,a.z)/9.81;else if(g)S.mag=Math.abs(Math.hypot(g.x,g.y,g.z)/9.81-1);
 if(r&&r.alpha!=null)S.rot=Math.hypot(r.alpha,r.beta,r.gamma);});
addEventListener('deviceorientation',e=>{if(e.webkitCompassHeading!=null)S.heading=e.webkitCompassHeading;else if(e.alpha!=null&&e.absolute)S.heading=360-e.alpha;if(e.beta!=null){S.beta=e.beta;S.gamma=e.gamma}});
// fallback: drag simulates tilt/shake
let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,t:performance.now()};toy&&toy.tap&&toy.tap(e.clientX,e.clientY)});
addEventListener('pointermove',e=>{if(drag){drag.vx=e.clientX-drag.x;if(S.real){drag.x=e.clientX;drag.y=e.clientY;drag.t=performance.now();return}}if(!drag||S.real)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y,dt=Math.max(1,performance.now()-drag.t);
 S.gx=Math.max(-9.8,Math.min(9.8,(e.clientX-W/2)/W*20));S.gy=Math.max(-9.8,Math.min(9.8,(e.clientY-H/2)/H*20));
 S.gamma=S.gx*4.5;S.beta=S.gy*4.5;const v=Math.hypot(dx,dy)/dt;S.mag=v*1.5;S.rot=v*400;drag={x:e.clientX,y:e.clientY,t:performance.now(),vx:dx}});
addEventListener('pointerup',()=>{drag=null});
// audio
function tone(f,d=.1,type='sine',v=.2,f2){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02)}
let hum=null;function humOn(type){if(!ac||hum)return;const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();o.type=type;f.type='lowpass';f.frequency.value=1200;g.gain.value=0;o.connect(f).connect(g).connect(ac.destination);o.start();hum={o,g,f}}
function humOff(){if(hum){hum.g.gain.setTargetAtTime(0,ac.currentTime,.05);const h=hum;setTimeout(()=>h.o.stop(),300);hum=null}}
$('#start').addEventListener('click',async()=>{
 try{ac=new (window.AudioContext||window.webkitAudioContext)();ac.resume();tone(523,.15,'triangle',.2,1046)}catch(e){}
await askPerm();
 show('menu')});
document.querySelectorAll('.btn').forEach(b=>b.onclick=()=>{tone(700,.08,'triangle',.15);open(b.dataset.t)});
$('#back').onclick=()=>{humOff();toy=null;show('menu');tone(400,.08,'triangle',.15)};
let perm='?';async function askPerm(){let ok=true;
 try{if(window.DeviceMotionEvent&&DeviceMotionEvent.requestPermission)ok=(await DeviceMotionEvent.requestPermission())=='granted'}catch(e){ok=false}
 try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)await DeviceOrientationEvent.requestPermission()}catch(e){}
 perm=ok?'ok':'no';$('#perm').style.display=perm=='no'?'block':'none'}
$('#perm').onclick=askPerm;
function txt(t,x,y,sz,c){ctx.fillStyle=c;ctx.textAlign='center';ctx.font='800 '+sz+'px "Inter Tight",sans-serif';ctx.fillText(t,x,y)}
function bg(a,b){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,a);g.addColorStop(1,b);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function circ(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=c;ctx.fill()}
function scream(d){if(!ac)return;tone(700,d,'sawtooth',.25,500);tone(712,d,'square',.12,480)}
const BL='#1f5bff',MI='#2ee6a8';
const TOYS={
kulki(){const cols=['#1f5bff','#2ee6a8','#5ab0ff','#9ff5d6','#0a3bd6','#ffffff'];let B=[];
 const add=(x,y)=>B.push({x,y,vx:(Math.random()-.5)*200,vy:(Math.random()-.5)*200,r:14+Math.random()*16,c:cols[B.length%cols.length]});
 for(let i=0;i<40;i++)add(Math.random()*W,Math.random()*H*.6);let lastShake=0;
 return{hint:'dotknij = nowa kulka • potrząśnij!',tap(x,y){for(let i=0;i<3;i++)add(x,y);tone(600+Math.random()*400,.08,'sine',.12)},
 step(dt,t){if(S.mag>1.4&&t-lastShake>300){lastShake=t;B.forEach(b=>{b.vx+=(Math.random()-.5)*1400;b.vy-=600+Math.random()*800});tone(200,.25,'square',.1,800)}
  const gx=S.gx*120,gy=S.gy*120;let hits=0;
  for(const b of B){b.vx+=gx*dt;b.vy+=gy*dt;b.vx*=.999;b.vy*=.999;b.x+=b.vx*dt;b.y+=b.vy*dt;
   if(b.x<b.r){b.x=b.r;if(b.vx<-150)hits++;b.vx*=-.7}if(b.x>W-b.r){b.x=W-b.r;if(b.vx>150)hits++;b.vx*=-.7}
   if(b.y<b.r){b.y=b.r;if(b.vy<-150)hits++;b.vy*=-.7}if(b.y>H-b.r){b.y=H-b.r;if(b.vy>150)hits++;b.vy*=-.7}}
  for(let k=0;k<2;k++)for(let i=0;i<B.length;i++)for(let j=i+1;j<B.length;j++){const a=B[i],b=B[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.r+b.r;
   if(d<m&&d>0){const nx=dx/d,ny=dy/d,o=(m-d)/2;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
    if(rv<0){const im=-(1.8)*rv/(a.r*a.r+b.r*b.r);a.vx-=im*b.r*b.r*nx;a.vy-=im*b.r*b.r*ny;b.vx+=im*a.r*a.r*nx;b.vy+=im*a.r*a.r*ny}}}
  if(hits&&Math.random()<.5)tone(300+Math.random()*300,.05,'sine',.06);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#eaf2ff');g.addColorStop(1,'#dffbf1');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const b of B){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);const rg=ctx.createRadialGradient(b.x-b.r*.35,b.y-b.r*.35,b.r*.1,b.x,b.y,b.r);rg.addColorStop(0,'#fff');rg.addColorStop(.35,b.c);rg.addColorStop(1,b.c=='#ffffff'?'#b8c8e8':b.c);ctx.fillStyle=rg;ctx.shadowColor='rgba(20,60,160,.25)';ctx.shadowBlur=10;ctx.shadowOffsetY=4;ctx.fill()}ctx.shadowColor='transparent'}}},
poz(){let bx=0,by=0,was=false;return{hint:'połóż telefon płasko',step(dt){
  const tx=Math.max(-1,Math.min(1,S.gamma/30)),ty=Math.max(-1,Math.min(1,(S.beta)/30));bx+=(tx-bx)*Math.min(1,dt*10);by+=(ty-by)*Math.min(1,dt*10);
  const deg=Math.hypot(S.gamma,S.beta),lvl=deg<1;if(lvl&&!was){tone(1320,.06,'square',.15);tone(1760,.12,'sine',.15)}was=lvl;
  ctx.fillStyle=lvl?MI:'#fff';ctx.fillRect(0,0,W,H);const cx=W/2,cy=H/2,R=Math.min(W,H)*.4;
  ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fillStyle=lvl?'#c9ffe9':'#e6efff';ctx.fill();ctx.lineWidth=6;ctx.strokeStyle=BL;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,34,0,7);ctx.lineWidth=4;ctx.stroke();ctx.beginPath();ctx.moveTo(cx-R,cy);ctx.lineTo(cx+R,cy);ctx.moveTo(cx,cy-R);ctx.lineTo(cx,cy+R);ctx.lineWidth=2;ctx.strokeStyle='rgba(31,91,255,.3)';ctx.stroke();
  let x=cx-bx*(R-30),y=cy-by*(R-30);if(lvl){x=cx;y=cy}ctx.beginPath();ctx.arc(x,y,28,0,7);const rg=ctx.createRadialGradient(x-9,y-9,3,x,y,28);rg.addColorStop(0,'#fff');rg.addColorStop(1,lvl?'#0bbf84':MI);ctx.fillStyle=rg;ctx.fill();
  ctx.fillStyle=lvl?'#06402c':BL;ctx.textAlign='center';ctx.font='800 72px "Inter Tight",sans-serif';ctx.fillText(deg.toFixed(1)+'°',cx,cy-R-30);
  ctx.font='800 26px "Inter Tight",sans-serif';ctx.fillText(lvl?'IDEALNIE! ✨':'prawie…',cx,cy+R+50)}}},
shake(){let rec=+localStorage.czRec||0,peak=0,disp=0,newRec=false;humOn('sawtooth');return{hint:'potrząśnij z całej siły!',step(dt,t){
  const g=S.mag;disp=Math.max(g,disp-dt*3);if(g>peak)peak=g;if(peak>rec){rec=peak;localStorage.czRec=rec.toFixed(2);if(!newRec)tone(880,.3,'triangle',.2,1760);newRec=true}
  if(hum){hum.o.frequency.setTargetAtTime(80+disp*220,ac.currentTime,.03);hum.g.gain.setTargetAtTime(Math.min(.25,disp*.08),ac.currentTime,.03)}
  const sh=Math.min(20,disp*6);ctx.save();ctx.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh);
  const k=Math.min(1,disp/4);ctx.fillStyle=`rgb(${31+k*14|0},${91+k*139|0},${255-k*87|0})`;ctx.fillRect(-30,-30,W+60,H+60);
  const cx=W/2,cy=H*.48;ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='800 '+(110+k*40)+'px "Inter Tight",sans-serif';ctx.fillText(disp.toFixed(1),cx,cy);
  ctx.font='800 32px "Inter Tight",sans-serif';ctx.fillText('G',cx,cy+44);
  const bw=W*.75,bh=26;ctx.fillStyle='rgba(255,255,255,.25)';rr(cx-bw/2,cy+80,bw,bh,13);ctx.fillStyle='#fff';rr(cx-bw/2,cy+80,bw*Math.min(1,disp/5),bh,13);
  ctx.font='800 24px "Inter Tight",sans-serif';ctx.fillText('teraz max: '+peak.toFixed(1)+' G',cx,cy+160);ctx.fillText((newRec?'🏆 NOWY REKORD: ':'rekord: ')+rec.toFixed(1)+' G',cx,cy+200);ctx.restore()}}},
miecz(){let trail=[],ang=0,sw=0;humOn('sawtooth');return{hint:'machnij telefonem jak Jedi!',step(dt,t){
  const r=S.rot;sw+=(Math.min(1,r/500)-sw)*Math.min(1,dt*12);ang=(S.real?S.gamma*Math.PI/180:Math.atan2(S.gx,9.8))*.9;
  if(hum){hum.o.frequency.setTargetAtTime(90+sw*260,ac.currentTime,.02);hum.f.frequency.setTargetAtTime(400+sw*3000,ac.currentTime,.02);hum.g.gain.setTargetAtTime(.05+sw*.22,ac.currentTime,.02)}
  ctx.fillStyle='#050b1f';ctx.fillRect(0,0,W,H);const bx=W/2,by=H*.82,L=H*.6,ex=bx+Math.sin(ang)*L,ey=by-Math.cos(ang)*L;
  trail.push([ex,ey]);if(trail.length>12)trail.shift();
  for(let i=0;i<trail.length-1;i++){ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(trail[i][0],trail[i][1]);ctx.lineTo(trail[i+1][0],trail[i+1][1]);ctx.fillStyle=`rgba(46,230,168,${i/trail.length*.12*(.3+sw)})`;ctx.fill()}
  ctx.lineCap='round';const fl=.9+Math.random()*.1;[[40,'rgba(46,230,168,.15)'],[24,'rgba(46,230,168,.35)'],[12,MI],[5,'#fff']].forEach(([w,c])=>{ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(ex,ey);ctx.lineWidth=w*fl*(1+sw*.5);ctx.strokeStyle=c;ctx.shadowColor=MI;ctx.shadowBlur=30;ctx.stroke()});ctx.shadowBlur=0;
  ctx.save();ctx.translate(bx,by);ctx.rotate(ang);ctx.fillStyle='#9aa7c4';rr(-12,0,24,90,8);ctx.fillStyle=BL;rr(-14,10,28,12,4);rr(-14,40,28,12,4);ctx.restore()}}},aaa(){let air=0,rec=+localStorage.czAir||0,last=0,on=false;return{hint:'podrzuć (nad łóżkiem!)',tap(){on=true;air=0;scream(.6);setTimeout(()=>on=false,600)},step(dt){
 const ff=S.real?S.gt<3:on;if(ff){if(!hum)humOn('sawtooth');air+=dt;if(hum){hum.o.frequency.setTargetAtTime(600+air*600,ac.currentTime,.02);hum.g.gain.setTargetAtTime(.3,ac.currentTime,.02)}}
 else if(air>0){humOff();last=air;if(air>rec){rec=air;localStorage.czAir=rec.toFixed(2)}air=0}
 bg(ff?'#ff5ea8':'#1f5bff',ff?'#ffd23f':MI);const cx=W/2,cy=H*.4,sh=ff?(Math.random()-.5)*20:0;
 circ(cx+sh,cy,110,'#fff');circ(cx-38+sh,cy-25,16,'#0a1a3a');circ(cx+38+sh,cy-25,16,'#0a1a3a');
 ctx.beginPath();ctx.ellipse(cx+sh,cy+40,ff?40:30,ff?55:8,0,0,7);ctx.fillStyle='#0a1a3a';ctx.fill();

function bg2(cx,cy,R){const g=ctx.createLinearGradient(0,cy-R,0,cy+R);g.addColorStop(0,'#5ab0ff');g.addColorStop(1,'#1f5bff');ctx.fillStyle=g;ctx.fillRect(cx-R,cy-R,2*R,2*R)}
function emo(e,x,y,s,r){ctx.save();ctx.translate(x,y);if(r)ctx.rotate(r);ctx.font=s+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#000';ctx.fillText(e,0,0);ctx.restore()}
function shaker(ms){let l=-1e9;return(t,th=1.1)=>{if(S.mag>th&&t-l>ms){l=t;return true}return false}}
function shk(a){ctx.translate((Math.random()-.5)*a,(Math.random()-.5)*a)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);ctx.fill()}
function open(n){show('toy');size();toy=TOYS[n]();$('#hint').textContent=toy.hint;$('#perm').style.display=perm=='no'?'block':'none';$('#hint').style.color=['dziura','atom','rakieta','disco','glitch','tornado','meteory','wulkan','hipno','warp','zombie','robot','laserkot','osmiornica','alfabet','dynia','lawa','odwrot','koty','pinata','shake','miecz','aaa','wirowka','kula8','fajerwerki','theremin','dolek','bilard','perkusja','banan','kosc'].includes(n)?'#fff':'#0a1a3a'}
function loop(t){const dt=Math.min(.033,(t-last)/1000||.016);last=t;if(!S.real&&!drag){S.mag*=.9;S.rot*=.9}if(drag&&drag.vx)drag.vx*=.5;if(toy)toy.step(dt,t);requestAnimationFrame(loop)}requestAnimationFrame(loop);

const q=location.hash.slice(1);if(q=='menu')show('menu');else if(TOYS[q]){open(q);if(q=='shake'){S.mag=2.6}if(q=='miecz'){S.gx=3;S.rot=300}}
