*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{position:fixed;inset:0;overflow:hidden;touch-action:none;font-family:'Inter Tight',system-ui,sans-serif;font-weight:800;background:#fff;color:#0a1a3a}
.scr{position:absolute;inset:0;display:none}.on{display:block}
#start{background:#fff;display:none;align-items:center;justify-content:center;flex-direction:column}
#start.on{display:flex}
#start h1{font-size:30vw;letter-spacing:-.06em;background:linear-gradient(120deg,#1f5bff,#2ee6a8);-webkit-background-clip:text;color:transparent;animation:pulse 1.6s ease-in-out infinite}
#start p{font-size:18px;color:#7a8bb0;margin-top:8px}
@keyframes pulse{50%{transform:scale(1.06)}}
#menu{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:linear-gradient(160deg,#1f5bff 0%,#3b8bff 45%,#5ef2c0 100%);padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 20px)}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}#grid .btn{flex-direction:column;align-items:flex-start;margin:0;padding:16px;font-size:20px;gap:10px}#grid .btn i{width:48px;height:48px;font-size:30px}#menu h2{color:#fff;font-size:44px;letter-spacing:-.04em;margin:10px 4px 18px}
.btn{display:flex;text-align:left;align-items:center;gap:16px;width:100%;margin-bottom:14px;padding:20px;border-radius:28px;background:rgba(255,255,255,.22);border:1.5px solid rgba(255,255,255,.5);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;font:inherit;font-size:26px;letter-spacing:-.02em;box-shadow:0 10px 30px rgba(0,30,120,.18);transition:transform .35s cubic-bezier(.3,1.8,.5,1);animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.btn:active{transform:scale(.93)}.btn i{font-style:normal;font-size:36px;width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,.9);display:grid;place-items:center}
.btn small{display:block;font-size:14px;opacity:.85;font-weight:700}
@keyframes pop{from{transform:scale(.6) translateY(30px);opacity:0}}
#toy canvas{position:absolute;inset:0;width:100%;height:100%}
#back{position:absolute;left:16px;top:calc(env(safe-area-inset-top) + 12px);z-index:5;padding:12px 18px;border-radius:22px;background:rgba(255,255,255,.3);border:1.5px solid rgba(255,255,255,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font:inherit;font-size:18px;color:#0a1a3a}
#perm{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 12px);z-index:5;padding:12px 16px;border-radius:22px;background:#2ee6a8;border:0;font:inherit;font-size:16px;color:#06402c;display:none}#hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 18px);text-align:center;font-size:16px;opacity:.6;z-index:4;pointer-events:none}

<div id="start" class="scr on"><h1>start</h1><p>dotknij gdziekolwiek</p></div>

<script>
const $=s=>document.querySelector(s),cv=$('#c'),ctx=cv.getContext('2d');
let W,H,DPR,ac=null,toy=null,last=0;
const S={gt:9.8,gx:0,gy:9.8,ax:0,ay:0,az:0,mag:0,beta:0,gamma:0,rot:0,real:false};
function size(){DPR=Math.min(devicePixelRatio||1,3);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',size);size();
function show(id){document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id==id))}
// sensors
addEventListener('devicemotion',e=>{const g=e.accelerationIncludingGravity,a=e.acceleration,r=e.rotationRate;
 if(g&&g.x!=null){S.real=true;S.gt=Math.hypot(g.x,g.y,g.z);let o=(screen.orientation&&screen.orientation.angle)||window.orientation||0;let x=-g.x,y=g.y;
  if(o==90){[x,y]=[y,-x]}else if(o==-90||o==270){[x,y]=[-y,x]}S.gx=x;S.gy=y;}
 if(a&&a.x!=null)S.mag=Math.hypot(a.x,a.y,a.z)/9.81;else if(g)S.mag=Math.abs(Math.hypot(g.x,g.y,g.z)/9.81-1);
 if(r&&r.alpha!=null)S.rot=Math.hypot(r.alpha,r.beta,r.gamma);});
addEventListener('deviceorientation',e=>{if(e.beta!=null){S.beta=e.beta;S.gamma=e.gamma}});
// fallback: drag simulates tilt/shake
let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,t:performance.now()};toy&&toy.tap&&toy.tap(e.clientX,e.clientY)});
addEventListener('pointermove',e=>{if(!drag||S.real)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y,dt=Math.max(1,performance.now()-drag.t);
 S.gx=Math.max(-9.8,Math.min(9.8,(e.clientX-W/2)/W*20));S.gy=Math.max(-9.8,Math.min(9.8,(e.clientY-H/2)/H*20));
 S.gamma=S.gx*4.5;S.beta=S.gy*4.5;const v=Math.hypot(dx,dy)/dt;S.mag=v*1.5;S.rot=v*400;drag={x:e.clientX,y:e.clientY,t:performance.now()}});
addEventListener('pointerup',()=>{drag=null});
// audio
function tone(f,d=.1,type='sine',v=.2,f2){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02)}
let hum=null;function humOn(type){if(!ac||hum)return;const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();o.type=type;f.type='lowpass';f.frequency.value=1200;g.gain.value=0;o.connect(f).connect(g).connect(ac.destination);o.start();hum={o,g,f}}
function humOff(){if(hum){hum.g.gain.setTargetAtTime(0,ac.currentTime,.05);const h=hum;setTimeout(()=>h.o.stop(),300);hum=null}}
$('#start').addEventListener('click',async()=>{
 try{ac=new (window.AudioContext||window.webkitAudioContext)();ac.resume();tone(523,.15,'triangle',.2,1046)}catch(e){}
await askPerm();
 show('menu')});
document.querySelectorAll('.btn').forEach(b=>b.onclick=()=>{tone(700,.08,'triangle',.15);open(b.dataset.t)});
$('#back').onclick=()=>{humOff();toy=null;show('menu');tone(400,.08,'triangle',.15)};
let perm='?';async function askPerm(){let ok=true;
 try{if(window.DeviceMotionEvent&&DeviceMotionEvent.requestPermission)ok=(await DeviceMotionEvent.requestPermission())=='granted'}catch(e){ok=false}
 try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)await DeviceOrientationEvent.requestPermission()}catch(e){}
 perm=ok?'ok':'no';$('#perm').style.display=perm=='no'?'block':'none'}
$('#perm').onclick=askPerm;
function txt(t,x,y,sz,c){ctx.fillStyle=c;ctx.textAlign='center';ctx.font='800 '+sz+'px "Inter Tight",sans-serif';ctx.fillText(t,x,y)}
function bg(a,b){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,a);g.addColorStop(1,b);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
