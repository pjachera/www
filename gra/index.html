<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SiekieroLas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Lilita+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="game.css" />
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a class="back" href="../index.html">← Łapsze</a>
      <h1 class="brand">SiekieroLas</h1>
      <div class="hud">
        <span id="score">0</span>
        <span class="sep">·</span>
        <span id="levelLabel">1/4</span>
        <span class="sep">·</span>
        <span id="axesLeft">🪓 5</span>
      </div>
    </header>
    <main class="stage-wrap">
      <div id="game"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay">
        <div class="panel">
          <p class="eyebrow">Phaser · fizyka</p>
          <h2 id="overlayTitle">SiekieroLas</h2>
          <p id="overlayText">Przeciągnij siekierę w LEWO (jak proca) i puść. Zniszcz grzybki!</p>
          <button id="startBtn" class="cta" type="button">Start</button>
        </div>
      </div>
    </main>
  </div>
  <script src="game.js?v=14"></script>
