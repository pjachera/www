<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14161b">
<title>Mini PC</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #14161b;
    color: #eef0f4;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body, .pc {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }
  .pc {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: max(4px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
    background: linear-gradient(180deg, #2e323a 0%, #1c1f25 16%, #14161b 100%);
  }
  .screen {
    flex: 68 1 0;
    min-height: 0;
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), 0 0 0 1px rgba(0,0,0,.45);
  }
  #frame {
    width: 100%; height: 100%;
    border: 0; display: block; background: #000;
    pointer-events: auto; touch-action: auto;
    position: relative; z-index: 0;
  }
  .cursor {
    position: absolute; left: 0; top: 0; width: 18px; height: 22px;
    pointer-events: none !important;
    z-index: 2;
    transform: translate(-2px, -1px);
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.65));
    display: none;
  }
  .cursor.show { display: block; pointer-events: none !important; }

  .deck {
    flex: 32 1 0;
    min-height: 0;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 12px;
    padding: 8px 2px 2px;
    overflow: hidden;
  }
  .kb {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  .kb-row {
    display: flex; justify-content: center; gap: .45%;
    margin: 0 0 .45%;
    flex: 1 1 0;
    max-height: 52px;
  }
  .key {
    flex: 1 1 0;
    min-width: 0;
    max-width: 64px;
    height: 100%;
    border: 0;
    border-radius: 7px;
    background: linear-gradient(180deg, #3c414c, #2c3038);
    color: #eef0f4;
    box-shadow: 0 2px 0 #0d0f13, inset 0 1px 0 rgba(255,255,255,.08);
    font: 600 clamp(11px, 1.6vh, 16px)/1 system-ui, sans-serif;
    padding: 0;
    cursor: pointer;
  }
  .key:active, .key.down { transform: translateY(1px); filter: brightness(.92); }
  .key.wide { flex: 1.45 1 0; max-width: 88px; font-size: clamp(9px, 1.2vh, 12px); color: #b4b9c4; }
  .key.wider { flex: 1.9 1 0; max-width: 110px; font-size: clamp(9px, 1.2vh, 12px); color: #b4b9c4; }
  .key.space { flex: 6.2 1 0; max-width: none; }
  .key.toggle.on { background: linear-gradient(180deg, #4a90d9, #2f6fb4); color: #fff; }
  .key .sub { display: block; font-size: clamp(7px, .9vh, 9px); font-weight: 500; color: #7ee0b0; margin-top: 1px; }
  .key.alt-mode { color: #7ee0b0; }
  .key.punct { font-size: clamp(16px, 2.2vh, 22px); font-weight: 700; }

  .pad-wrap {
    flex: 0 0 22%;
    min-width: 132px;
    max-width: 280px;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 8px;
    padding: 4px 0;
  }
  .trackpad {
    flex: 1 1 auto;
    min-width: 0;
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(255,255,255,.05), transparent 40%), #1a1c21;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), inset 0 2px 8px rgba(0,0,0,.45);
    touch-action: none;
  }
  .trackpad.held { background: #1e2127; }
  .scrollstrip {
    width: 28px; flex: 0 0 28px;
    border-radius: 12px;
    background: #1a1c21;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.07), inset 0 2px 8px rgba(0,0,0,.45);
    touch-action: none;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,.3);
    font-size: 13px;
    user-select: none;
  }

  @media (orientation: portrait) and (max-width: 900px) {
    .screen { flex: 58 1 0; }
    .deck {
      flex: 42 1 0;
      flex-direction: column;
      gap: 6px;
      padding: 6px 0 0;
    }
    .kb { flex: 1 1 auto; }
    .kb-row { max-height: 42px; }
    .pad-wrap {
      flex: 0 0 auto;
      width: min(280px, 70%);
      max-width: none;
      height: clamp(64px, 11vh, 100px);
      margin: 0 auto;
      padding: 0;
    }
  }
</style>
</head>
<body>
  <div class="pc">
    <div class="screen" id="screen">
      <iframe id="frame" title="" src="https://jessica-fine-location-demanding.trycloudflare.com" allow="fullscreen"></iframe>
      <svg class="cursor" id="cursor" viewBox="0 0 18 22" aria-hidden="true">
        <path d="M1 1 L1 17 L5.5 13.2 L9.2 21 L12.2 19.6 L8.4 12 L14.5 11.6 Z" fill="#fff" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="deck">
      <div class="kb" id="kb"></div>
      <div class="pad-wrap">
        <div class="trackpad" id="pad" role="application" aria-label="Trackpad"></div>
        <div class="scrollstrip" id="scroll">↕</div>
      </div>
    </div>
  </div>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var screenEl = $("screen");
  var frame = $("frame");
  var cursorEl = $("cursor");
  var pad = $("pad");
  var scrollStrip = $("scroll");
  var POLISH = { a:"ą", c:"ć", e:"ę", l:"ł", n:"ń", o:"ó", s:"ś", x:"ź", z:"ż" };

  function typeInto(text) {
    var el = document.activeElement;
    if (el && el !== document.body && el !== frame && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable)) {
      var start = el.selectionStart != null ? el.selectionStart : (el.value || "").length;
      var end = el.selectionEnd != null ? el.selectionEnd : start;
      var v = el.value || "";
      el.value = v.slice(0, start) + text + v.slice(end);
      try { el.setSelectionRange(start + text.length, start + text.length); } catch (e) {}
      el.dispatchEvent(new Event("input", { bubbles: true }));
      return;
    }
    try {
      var doc = frame.contentDocument;
      var t = doc && doc.activeElement;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) {
        var s = t.selectionStart != null ? t.selectionStart : (t.value || "").length;
        var e2 = t.selectionEnd != null ? t.selectionEnd : s;
        var v2 = t.value || "";
        t.value = v2.slice(0, s) + text + v2.slice(e2);
        try { t.setSelectionRange(s + text.length, s + text.length); } catch (e3) {}
        t.dispatchEvent(new Event("input", { bubbles: true }));
      }
    } catch (e) {
      try { frame.focus(); } catch (e4) {}
    }
  }

  function backspace() {
    var el = document.activeElement;
    if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")) {
      var start = el.selectionStart != null ? el.selectionStart : el.value.length;
      var end = el.selectionEnd != null ? el.selectionEnd : start;
      var v = el.value || "";
      if (start !== end) {
        el.value = v.slice(0, start) + v.slice(end);
        try { el.setSelectionRange(start, start); } catch (e) {}
      } else if (start > 0) {
        el.value = v.slice(0, start - 1) + v.slice(end);
        try { el.setSelectionRange(start - 1, start - 1); } catch (e) {}
      }
      el.dispatchEvent(new Event("input", { bubbles: true }));
      return;
    }
    try {
      var doc = frame.contentDocument;
      var t = doc && doc.activeElement;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) {
        var s = t.selectionStart != null ? t.selectionStart : t.value.length;
        var e2 = t.selectionEnd != null ? t.selectionEnd : s;
        var v2 = t.value || "";
        if (s !== e2) { t.value = v2.slice(0, s) + v2.slice(e2); try { t.setSelectionRange(s, s); } catch (e3) {} }
        else if (s > 0) { t.value = v2.slice(0, s - 1) + v2.slice(e2); try { t.setSelectionRange(s - 1, s - 1); } catch (e3) {} }
        t.dispatchEvent(new Event("input", { bubbles: true }));
      }
    } catch (e) {
      try { frame.focus(); } catch (e4) {}
    }
  }

  var shift = false, alt = false, caps = false;
  var ROWS = [
    [
      { label:"Esc", wide:"wide", special:"esc" },
      "1","2","3","4","5","6","7","8","9","0","-","=",
      { label:"⌫", wide:"wider", special:"bksp" }
    ],
    [
      { label:"Tab", wide:"wide", special:"tab" },
      "q","w","e","r","t","y","u","i","o","p"
    ],
    [
      { label:"Caps", wide:"wider", special:"caps" },
      "a","s","d","f","g","h","j","k","l",
      { label:":", key:":" },
      { label:"Enter", wide:"wider", special:"enter" }
    ],
    [
      { label:"Shift", wide:"wider", special:"shift" },
      "z","x","c","v","b","n","m",".","/",
      { label:"Shift", wide:"wider", special:"shift" }
    ],
    [
      { label:"Alt  PL", wide:"wider", special:"alt" },
      { label:"", wide:"space", special:"space" },
      { label:"←", special:"left" },
      { label:"→", special:"right" }
    ]
  ];

  function letterFor(base) {
    var lower = base.toLowerCase();
    var ch = lower;
    if (alt && POLISH[lower]) ch = POLISH[lower];
    if (shift || caps) ch = ch.toUpperCase();
    return ch;
  }

  var kb = $("kb");
  function renderKb() {
    kb.textContent = "";
    ROWS.forEach(function (row) {
      var r = document.createElement("div");
      r.className = "kb-row";
      row.forEach(function (item) {
        var b = document.createElement("button");
        b.type = "button";
        var isObj = typeof item === "object";
        var special = isObj ? (item.special || "") : "";
        var key = isObj ? (item.key || "") : item;
        b.className = "key" + (isObj && item.wide ? " " + item.wide : "");
        if (special === "shift" && shift) b.className += " toggle on";
        if (special === "caps" && caps) b.className += " toggle on";
        if (special === "alt" && alt) b.className += " toggle on";
        if (key && ".,-/=:;?!".indexOf(key) !== -1) b.className += " punct";
        if (key) {
          var ch = letterFor(key);
          if (!alt && POLISH[key]) {
            var sub = document.createElement("span");
            sub.className = "sub";
            sub.textContent = (shift || caps) ? POLISH[key].toUpperCase() : POLISH[key];
            b.appendChild(document.createTextNode(ch));
            b.appendChild(sub);
          } else {
            b.textContent = ch;
            if (alt && POLISH[key]) b.className += " alt-mode";
          }
        } else {
          b.textContent = item.label;
        }
        b.dataset.special = special;
        b.dataset.key = key;
        r.appendChild(b);
      });
      kb.appendChild(r);
    });
  }
  renderKb();

  function moveCaret(dir) {
    var el = document.activeElement;
    if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")) {
      var pos = el.selectionStart != null ? el.selectionStart : el.value.length;
      var n = dir < 0 ? Math.max(0, pos - 1) : Math.min(el.value.length, pos + 1);
      try { el.setSelectionRange(n, n); } catch (e) {}
    }
  }

  function onKey(special, key) {
    if (special === "bksp") { backspace(); return; }
    if (special === "enter") { typeInto("\n"); return; }
    if (special === "space") { typeInto(" "); return; }
    if (special === "tab") { typeInto("\t"); return; }
    if (special === "esc") { return; }
    if (special === "shift") { shift = !shift; renderKb(); return; }
    if (special === "caps") { caps = !caps; renderKb(); return; }
    if (special === "alt") { alt = !alt; renderKb(); return; }
    if (special === "left") { moveCaret(-1); return; }
    if (special === "right") { moveCaret(1); return; }
    if (key) {
      typeInto(letterFor(key));
      if (shift) { shift = false; renderKb(); }
    }
  }

  kb.addEventListener("pointerdown", function (e) {
    var b = e.target.closest(".key");
    if (!b) return;
    e.preventDefault();
    b.classList.add("down");
    onKey(b.dataset.special, b.dataset.key);
  });
  function keyUp(e) {
    var b = e.target.closest && e.target.closest(".key");
    if (b) b.classList.remove("down");
  }
  kb.addEventListener("pointerup", keyUp);
  kb.addEventListener("pointercancel", keyUp);
  kb.addEventListener("pointerleave", keyUp);

  var cx = 80, cy = 80;

  function placeCursor() {
    var w = screenEl.clientWidth, h = screenEl.clientHeight;
    if (w < 2 || h < 2) return;
    cx = Math.max(0, Math.min(w - 2, cx));
    cy = Math.max(0, Math.min(h - 2, cy));
    cursorEl.style.left = cx + "px";
    cursorEl.style.top = cy + "px";
    cursorEl.classList.add("show");
  }

  function pointFromCursor() {
    var r = screenEl.getBoundingClientRect();
    return { x: r.left + cx, y: r.top + cy };
  }

  function elementUnderCursor() {
    cursorEl.style.pointerEvents = "none";
    var p = pointFromCursor();
    var el = document.elementFromPoint(p.x, p.y);
    return el;
  }

  function clickAtCursor() {
    var el = elementUnderCursor();
    if (!el) return;
    if (el.tagName === "IFRAME" || el === frame) {
      try { frame.focus(); } catch (e) {}
      return;
    }
    if (el.matches && el.matches("input, textarea, button, a, select, [tabindex]")) {
      try { el.focus(); } catch (e) {}
    }
    var p = pointFromCursor();
    var opts = { bubbles: true, cancelable: true, view: window, clientX: p.x, clientY: p.y, button: 0, buttons: 1 };
    try { el.dispatchEvent(new MouseEvent("click", opts)); } catch (e) { try { el.click(); } catch (e2) {} }
  }

  function scrollAtCursor(dy, dx) {
    dx = dx || 0;
    var el = elementUnderCursor();
    if (el && (el === frame || el.tagName === "IFRAME")) {
      try { frame.contentWindow.scrollBy(dx, dy); } catch (e) {}
      return;
    }
    var node = el;
    while (node && node !== document.body) {
      if (node.scrollHeight - node.clientHeight > 2 || node.scrollWidth - node.clientWidth > 2) {
        node.scrollBy(dx, dy);
        return;
      }
      node = node.parentElement;
    }
  }

  var pointers = {};
  var pointerCount = 0;
  var padMode = null;
  var movedDist = 0;

  pad.addEventListener("pointerdown", function (e) {
    try { pad.setPointerCapture(e.pointerId); } catch (err) {}
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    pointerCount++;
    pad.classList.add("held");
    movedDist = 0;
    padMode = pointerCount >= 2 ? "scroll" : "pending";
    placeCursor();
    e.preventDefault();
  });

  pad.addEventListener("pointermove", function (e) {
    var prev = pointers[e.pointerId];
    if (!prev) return;
    var dx = e.clientX - prev.x;
    var dy = e.clientY - prev.y;
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (pointerCount >= 2) {
      padMode = "scroll";
      scrollAtCursor(-dy * 1.6, -dx * 1.2);
      movedDist += Math.abs(dx) + Math.abs(dy);
      return;
    }
    movedDist += Math.abs(dx) + Math.abs(dy);
    if (movedDist > 6) padMode = "move";
    cx += dx * 1.45;
    cy += dy * 1.45;
    placeCursor();
  });

  function padUp(e) {
    if (!pointers[e.pointerId]) return;
    delete pointers[e.pointerId];
    pointerCount = Math.max(0, pointerCount - 1);
    if (pointerCount === 0) {
      pad.classList.remove("held");
      if (padMode !== "scroll" && movedDist <= 6) clickAtCursor();
      padMode = null;
      movedDist = 0;
    }
  }
  pad.addEventListener("pointerup", padUp);
  pad.addEventListener("pointercancel", padUp);
  pad.addEventListener("wheel", function (e) {
    e.preventDefault();
    scrollAtCursor(e.deltaY, e.deltaX);
  }, { passive: false });

  var scrollLastY = null;
  scrollStrip.addEventListener("pointerdown", function (e) {
    try { scrollStrip.setPointerCapture(e.pointerId); } catch (err) {}
    scrollLastY = e.clientY;
    e.preventDefault();
  });
  scrollStrip.addEventListener("pointermove", function (e) {
    if (scrollLastY == null) return;
    var dy = e.clientY - scrollLastY;
    scrollLastY = e.clientY;
    scrollAtCursor(dy * 2, 0);
  });
  function scrollEnd() { scrollLastY = null; }
  scrollStrip.addEventListener("pointerup", scrollEnd);
  scrollStrip.addEventListener("pointercancel", scrollEnd);
})();
</script>
</body>
</html>
