*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#2f6bff;
 font-family:"IT",-apple-system,system-ui,sans-serif;font-weight:800;-webkit-font-smoothing:antialiased}
.scr{position:fixed;inset:0}
/* start */
#start{background:#fff;display:flex;align-items:center;justify-content:center;z-index:5;cursor:pointer;transition:opacity .35s,transform .35s}
#start span{font-size:52px;color:#14161c;letter-spacing:-1.5px;animation:breathe 2.4s ease-in-out infinite}
#start.out{opacity:0;transform:scale(1.08);pointer-events:none}
@keyframes breathe{50%{transform:scale(1.06)}}
/* countdown */
#cd{background:#fff;display:none;align-items:center;justify-content:center;z-index:4;transition:opacity .4s}
#cd span{font-size:190px;color:#14161c;letter-spacing:-8px;line-height:1}
#cd span.go{color:#2f6bff;font-size:150px;letter-spacing:-5px}
#cd span.pop{animation:cdpop .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes cdpop{0%{transform:scale(.2) rotate(-8deg);opacity:0}35%{opacity:1}100%{transform:scale(1) rotate(0)}}
#cd.out{opacity:0}
/* main */
#app{background:radial-gradient(120% 70% at 20% 0%,#5a8bff 0%,#2f6bff 45%,#2457e6 100%);overflow:hidden}
#app::before{content:"";position:absolute;width:140vw;height:140vw;left:-20vw;top:-70vw;border-radius:50%;
 background:radial-gradient(closest-side,rgba(255,255,255,.18),transparent);animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(12vw,6vh)}}
#mint{position:absolute;left:0;right:0;top:0;height:120%;will-change:transform;border-radius:46px 46px 0 0;overflow:hidden;
 background:linear-gradient(180deg,rgba(214,255,236,.96) 0%,rgba(160,243,208,.92) 22%,rgba(132,232,192,.9) 100%);
 -webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);
 box-shadow:0 -14px 50px rgba(10,30,120,.28),inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 22px 34px -16px rgba(255,255,255,.75)}
#mint svg{position:absolute;left:0;top:6px;width:200%;height:34px;animation:wave 6s linear infinite;opacity:.8}
@keyframes wave{to{transform:translateX(-50%)}}
#sheen{position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.35) 45%,transparent 60%);
 background-size:250% 100%;animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%{background-position:120% 0}60%,100%{background-position:-60% 0}}
#mint.flash{animation:mflash .5s ease-out}
@keyframes mflash{30%{filter:brightness(1.12) saturate(1.3)}}
#num{position:absolute;left:0;right:0;top:0;height:76%;display:flex;align-items:center;justify-content:center;pointer-events:none}
#num .d{position:absolute;font-size:min(46vw,210px);color:#fff;letter-spacing:-.06em;line-height:1;
 text-shadow:0 10px 40px rgba(8,24,110,.28),0 2px 0 rgba(255,255,255,.15);font-variant-numeric:tabular-nums}
#num .in{animation:rin .55s cubic-bezier(.2,1.5,.4,1) both}
#num .outd{animation:rout .3s ease-in both}
@keyframes rin{0%{transform:translateY(40%) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes rout{to{transform:translateY(-45%) scale(.7);opacity:0}}
#num .big{animation:rbig .8s cubic-bezier(.2,1.6,.4,1) both}
@keyframes rbig{0%{transform:scale(.4);opacity:0}50%{transform:scale(1.18)}100%{transform:none;opacity:1}}
#ring{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px;border-radius:50%;border:6px solid rgba(255,255,255,.9);opacity:0;pointer-events:none}
#ring.go{animation:ring .9s cubic-bezier(.1,.8,.3,1)}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0;border-width:1px}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#top{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 18px);display:flex;justify-content:center;pointer-events:none}
.chip{padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.16);color:rgba(255,255,255,.92);font-size:15px;letter-spacing:.2px;
 -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.22)}
#hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 22px);text-align:center;color:rgba(20,70,55,.55);font-size:14px;transition:opacity 1s;pointer-events:none;opacity:0}
/* summary */
#sum{display:none;z-index:6;background:rgba(15,30,90,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);align-items:flex-end;justify-content:center}
#card{width:100%;max-width:520px;background:#fff;border-radius:34px 34px 0 0;padding:30px 24px calc(env(safe-area-inset-bottom) + 24px);
 text-align:center;animation:up .6s cubic-bezier(.2,1.25,.4,1) both;box-shadow:0 -20px 60px rgba(0,0,0,.2)}
@keyframes up{from{transform:translateY(100%)}}
#card .t{font-size:22px;color:#14161c}
#card .big{font-size:110px;line-height:1;color:#2f6bff;letter-spacing:-5px;margin:6px 0 0}
#card .lbl{font-size:16px;color:#8a90a0;margin-bottom:20px}
#rec{display:none;margin:0 auto 14px;width:max-content;padding:7px 14px;border-radius:99px;background:#d6ffec;color:#0f8a5a;font-size:15px;animation:cdpop .8s .3s cubic-bezier(.2,1.6,.4,1) both}
.row{display:flex;gap:10px;margin-bottom:20px}
.st{flex:1;background:#f3f6ff;border-radius:20px;padding:14px 6px}
.st b{display:block;font-size:26px;color:#14161c;letter-spacing:-.5px}
.st i{font-style:normal;font-size:13px;color:#8a90a0}
.btn{display:block;width:100%;border:0;border-radius:22px;padding:19px;font:800 20px "IT",system-ui;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.96)}
#again{background:#2f6bff;color:#fff;box-shadow:0 10px 26px rgba(47,107,255,.35)}
#resume{background:transparent;color:#2f6bff;margin-top:6px}

function makeDetector(onRep){
 // gravity LPF, vertical projection, leaky double integration -> displacement
 const S={g:null,v:0,vel:0,pos:0,st:0,t0:0,tMin:0,minPos:0,last:-9,noise:0.05,calib:true,depth:0,gm:null,cn:0,cs:0,lt:null,phase:0};

  const kg=1-Math.exp(-dt/1.2);const g=S.g;g[0]+=kg*(ax-g[0]);g[1]+=kg*(ay-g[1]);g[2]+=kg*(az-g[2]);
  const gm=Math.hypot(g[0],g[1],g[2])||1;

  const hx=ax-g[0],hy=ay-g[1],hz=az-g[2],l2=lin+S.gm-gm;const hh=Math.sqrt(Math.max(0,hx*hx+hy*hy+hz*hz-l2*l2));

  const lk=Math.exp(-dt/1.5);S.vel=S.vel*lk+S.v*dt;S.pos=S.pos*Math.exp(-dt/2.0)+S.vel*dt;

  else{S.mx=Math.max(S.mx,th);const d2=t-S.t2;

   else if(S.pos>S.minPos+.5*dep&&t-S.tMin>0.15){S.st=0;S.peak=S.pos;

const $=id=>document.getElementById(id);
const LS='przysiady_rekord';let best=+(localStorage.getItem(LS)||0);
let count=0,running=false,det=null,t0=0,tAcc=0,ac=null,master=null,wl=null,lvl=0,lvlT=0,lvlV=0;
$('best').textContent='rekord '+best;
/* ---------- dźwięk ---------- */
function audio(){if(ac)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=new C();
 master=ac.createDynamicsCompressor();master.threshold.value=-14;master.connect(ac.destination);
 const dl=ac.createDelay();dl.delayTime.value=.18;const fb=ac.createGain();fb.gain.value=.25;const wet=ac.createGain();wet.gain.value=.22;
 dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(master);master.fx=dl;
 const b=ac.createBuffer(1,1,22050),s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(0);if(ac.resume)ac.resume()}
function tone(f,t,dur,vol,type='sine',wet=true){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(master);if(wet)g.connect(master.fx);o.start(t);o.stop(t+dur+.05)}
function bell(f,t,vol=.28,dur=.9){tone(f,t,dur,vol);tone(f*2,t,dur*.5,vol*.35);tone(f*3.01,t,dur*.25,vol*.12)}
function tick(){if(!ac)return;const t=ac.currentTime;tone(880,t,.12,.22,'sine',false);tone(1760,t,.05,.06,'triangle',false)}
function goSnd(){if(!ac)return;const t=ac.currentTime;[523.25,659.25,783.99,1046.5].forEach((f,i)=>bell(f,t+i*.06,.2,1.1));
 const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(900,t+.25);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+.35);o.connect(g);g.connect(master);o.start(t);o.stop(t+.4)}
const PENTA=[0,2,4,7,9];
function repSnd(n){if(!ac)return;const k=(n-1)%10,semi=PENTA[k%5]+12*Math.floor(k/5);bell(523.25*Math.pow(2,semi/12),ac.currentTime,.3,.8)}
function tenSnd(){if(!ac)return;const t=ac.currentTime+.08;[261.63,329.63,392,523.25,659.25,783.99].forEach((f,i)=>{bell(f,t+i*.045,.16,1.8);tone(f*1.003,t+i*.045,1.6,.05,'sawtooth',true)});
 [1046.5,1318.5,1568,2093].forEach((f,i)=>tone(f,t+.35+i*.07,.4,.06,'sine'))}

function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
/* ---------- wygląd ---------- */
function showNum(n,big){const box=$('num');box.querySelectorAll('.d').forEach(e=>{if(e.classList.contains('outd'))e.remove();else{e.classList.add('outd');setTimeout(()=>e.remove(),320)}});

const fx=$('fx'),g2=fx.getContext('2d');let parts=[];
function sizeFx(){const r=devicePixelRatio||1;fx.width=innerWidth*r;fx.height=innerHeight*r;g2.setTransform(r,0,0,r,0,0)}sizeFx();addEventListener('resize',sizeFx);
function burst(){const cx=innerWidth/2,cy=innerHeight/2,cols=['#ffffff','#b8ffe0','#ffe066','#9cc0ff'];
 for(let i=0;i<70;i++){const a=Math.random()*Math.PI*2,v=4+Math.random()*9;parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,r:3+Math.random()*5,c:cols[i%4],l:1,rot:Math.random()*6})}

/* ---------- pętla animacji: tafla rusza się z fazą przysiadu ---------- */
function frame(){
 if(det){const dep=det.depth||.25,ph=Math.max(-det.pos/dep,(det.th||0)/60,-.35);lvlT=Math.max(-.35,Math.min(1.1,ph))}else lvlT=0;

function onMotion(e){const a=e.accelerationIncludingGravity;if(!a||a.x==null||!det)return;det.update(a.x,a.y,a.z,performance.now()/1000)}

function countdown(done){const cd=$('cd'),s=$('cdn');cd.classList.remove('out');cd.style.display='flex';const seq=['3','2','1','GO!'];let i=0;
 (function step(){s.textContent=seq[i];s.className=i===3?'go':'';void s.offsetWidth;s.classList.add('pop');
  if(i<3){tick();buzz(25)}else{goSnd();buzz(80)}
  if(++i<seq.length)setTimeout(step,1000);else setTimeout(()=>{cd.classList.add('out');setTimeout(()=>cd.style.display='none',400);done()},650)})()}

 if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){try{await DeviceMotionEvent.requestPermission()}catch(e){}}

$('app').addEventListener('click',()=>{if(!running)return;running=false;tAcc+=(performance.now()-t0)/1000;

 $('sN').textContent=count;$('sT').textContent=fmt(tAcc);$('sP').textContent=tAcc>3?Math.round(count/(tAcc/60)):0;$('sB').textContent=best;
 $('rec').style.display=rec?'block':'none';$('best').textContent='rekord '+best;$('sum').style.display='flex';
 const c=$('card');c.style.animation='none';void c.offsetWidth;c.style.animation='';if(rec&&ac){tenSnd()}});
