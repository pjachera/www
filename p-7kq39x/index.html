*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:"IT",-apple-system,system-ui,sans-serif}
#start{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:3;cursor:pointer}
#start span{font-size:44px;font-weight:800;color:#1a1a1a;letter-spacing:-1px}
#cd{position:fixed;inset:0;background:#fff;display:none;align-items:center;justify-content:center;z-index:2}
#cd span{font-size:160px;font-weight:800;color:#1a1a1a;animation:pop .9s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}40%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
#app{position:fixed;inset:0;background:#2f6bff}
#mint{position:absolute;left:0;right:0;bottom:0;height:40%;border-radius:44px 44px 0 0;
background:linear-gradient(180deg,rgba(215,255,238,.97) 0%,rgba(165,242,210,.93) 30%,rgba(150,236,200,.9) 100%);
backdrop-filter:blur(26px) saturate(1.6);-webkit-backdrop-filter:blur(26px) saturate(1.6);
border-top:1.5px solid rgba(255,255,255,.85);
box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 18px 30px -12px rgba(255,255,255,.55),0 -10px 40px rgba(0,0,0,.12);
transition:height .12s ease-out}
#mint::before{content:"";position:absolute;left:8%;right:8%;top:10px;height:14px;border-radius:10px;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);filter:blur(4px)}
#n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:150px;font-weight:800;color:#fff;
letter-spacing:-6px;text-shadow:0 6px 30px rgba(0,0,0,.15);transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
#n.pop{transform:scale(1.15)}
</style></head><body>
<div id="start"><span>start</span></div>
<div id="cd"><span id="cdn">3</span></div>
<div id="app"><div id="mint"></div><div id="n">0</div></div>
<script>
const $=id=>document.getElementById(id);
let count=0,running=false,state='idle',tPeak=0,lastRep=0,f=9.81,base=9.81,lvl=40,ctx;
function beep(fr=880,len=.15){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();
o.frequency.value=fr;g.gain.setValueAtTime(.25,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+len);
o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+len)}catch(e){}}
const T=1.6;
function rep(){count++;const n=$('n');n.textContent=count;n.classList.add('pop');setTimeout(()=>n.classList.remove('pop'),180);beep();if(navigator.vibrate)navigator.vibrate(60)}
function onMotion(e){const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;
 const m=Math.hypot(a.x,a.y,a.z);f+=0.35*(m-f);base+=0.01*(f-base);const d=f-base,now=performance.now();
 // zielona część: w dół przy opadaniu (lżej), w górę przy wstawaniu (ciężej)
 lvl+=0.25*((40+d*9)-lvl);$('mint').style.height=Math.max(5,Math.min(95,lvl))+'%';
 if(!running)return;
 if(state==='idle'&&d<-T){state='down';tPeak=now}
 else if(state==='down'){if(d>T){state='up';tPeak=now}else if(now-tPeak>2500)state='idle'}
 else if(state==='up'){if(d<T*0.3){if(now-lastRep>900){lastRep=now;rep()}state='idle'}else if(now-tPeak>2500)state='idle'}}
$('start').onclick=async()=>{
 if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
  try{await DeviceMotionEvent.requestPermission()}catch(e){}}
 window.addEventListener('devicemotion',onMotion);
 $('start').style.display='none';$('cd').style.display='flex';
 const seq=['3','2','1','GO!'];let i=0;
 (function step(){const s=$('cdn');s.textContent=seq[i];s.style.animation='none';s.offsetHeight;s.style.animation='';
  beep(i<3?600:1000,i<3?.12:.3);
  if(++i<seq.length)setTimeout(step,1000);else setTimeout(()=>{$('cd').style.display='none';running=true},700)})();
};
</script></body></html>
