<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mega Skaner</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif}
#wrap{position:relative;width:100vw;height:62vh;overflow:hidden}
video,#ov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#bar{display:flex;gap:6px;padding:8px;overflow-x:auto}
#bar button{flex:1;padding:12px 8px;border:0;border-radius:20px;background:#222;color:#fff;font-size:15px;white-space:nowrap}
#bar button.on{background:#0a7;font-weight:700}
#out{padding:10px 14px;font-size:16px;white-space:pre-wrap;max-height:28vh;overflow:auto}
#st{position:absolute;left:8px;top:8px;background:#0008;padding:4px 10px;border-radius:12px;font-size:13px}
#start{position:absolute;inset:0;margin:auto;width:200px;height:60px;font-size:20px;border:0;border-radius:30px;background:#0a7;color:#fff}
a{color:#4df}
</style></head><body>
<div id="wrap"><video id="v" playsinline muted></video><canvas id="ov"></canvas><div id="st">Mega Skaner</div><button id="start">▶ START</button></div>
<div id="bar">
<button data-m="obj" class="on">🔎 Obiekty (AI)</button>
<button data-m="qr">▦ QR / kody</button>
<button data-m="ocr">🔤 Tekst</button>
<button data-m="col">🎨 Kolor</button>
</div>
<div id="out">Wybierz tryb i celuj aparatem.</div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const PL={person:'człowiek',bicycle:'rower',car:'samochód',motorcycle:'motocykl',bus:'autobus',truck:'ciężarówka',dog:'pies',cat:'kot',bird:'ptak',horse:'koń',cow:'krowa',sheep:'owca',bottle:'butelka',cup:'kubek',fork:'widelec',knife:'nóż',spoon:'łyżka',bowl:'miska',banana:'banan',apple:'jabłko',orange:'pomarańcza',chair:'krzesło',couch:'kanapa','potted plant':'roślina',bed:'łóżko','dining table':'stół',tv:'telewizor',laptop:'laptop',mouse:'myszka',remote:'pilot',keyboard:'klawiatura','cell phone':'telefon',book:'książka',clock:'zegar',vase:'wazon',scissors:'nożyczki','teddy bear':'miś','toothbrush':'szczoteczka',backpack:'plecak',umbrella:'parasol',handbag:'torebka',tie:'krawat',suitcase:'walizka',ball:'piłka','sports ball':'piłka',kite:'latawiec',pizza:'pizza',donut:'pączek',cake:'ciasto',sandwich:'kanapka',carrot:'marchewka',broccoli:'brokuł','hot dog':'hot dog',refrigerator:'lodówka',oven:'piekarnik',microwave:'mikrofalówka',sink:'zlew',toilet:'toaleta','wine glass':'kieliszek','traffic light':'sygnalizacja','stop sign':'znak stop',bench:'ławka',train:'pociąg',airplane:'samolot',boat:'łódź',skateboard:'deskorolka',skis:'narty',snowboard:'snowboard','tennis racket':'rakieta','baseball bat':'kij','hair drier':'suszarka',toaster:'toster',elephant:'słoń',bear:'niedźwiedź',zebra:'zebra',giraffe:'żyrafa',frisbee:'frisbee','fire hydrant':'hydrant','parking meter':'parkometr'};
const v=document.getElementById('v'),ov=document.getElementById('ov'),o=ov.getContext('2d'),out=document.getElementById('out'),st=document.getElementById('st');
const tmp=document.createElement('canvas'),tx=tmp.getContext('2d',{willReadFrequently:true});
let mode='obj',model=null,busy=false,ocrW=null;
document.querySelectorAll('#bar button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#bar button').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.m;o.clearRect(0,0,ov.width,ov.height);
 out.textContent=mode==='ocr'?'Celuj w tekst i stuknij w obraz, żeby odczytać.':mode==='col'?'Środek ekranu = kolor.':'Celuj aparatem…'});
document.getElementById('start').onclick=async e=>{e.target.remove();
 const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}});v.srcObject=s;await v.play();
 st.textContent='Ładuję AI…';cocoSsd.load({base:'lite_mobilenet_v2'}).then(m=>{model=m;st.textContent='AI gotowe ✅'});loop();};
function map(x,y){const vw=v.videoWidth,vh=v.videoHeight,W=ov.width,H=ov.height,s=Math.max(W/vw,H/vh);return[x*s+(W-vw*s)/2,y*s+(H-vh*s)/2,s]}
async function loop(){
 ov.width=ov.clientWidth;ov.height=ov.clientHeight;
 if(!busy&&v.videoWidth){busy=true;try{
  if(mode==='obj'&&model){const p=await model.detect(v);o.clearRect(0,0,ov.width,ov.height);o.lineWidth=3;o.font='bold 18px system-ui';
   p.forEach(d=>{const[x,y,s]=map(d.bbox[0],d.bbox[1]);o.strokeStyle='#0f8';o.strokeRect(x,y,d.bbox[2]*s,d.bbox[3]*s);const t=(PL[d.class]||d.class)+' '+Math.round(d.score*100)+'%';o.fillStyle='#0f8';o.fillRect(x,y-24,o.measureText(t).width+10,24);o.fillStyle='#000';o.fillText(t,x+5,y-6)});
   out.textContent=p.length?'Widzę: '+[...new Set(p.map(d=>PL[d.class]||d.class))].join(', '):'Nic nie rozpoznaję…'}
  else if(mode==='qr'){const w=480,h=Math.round(w*v.videoHeight/v.videoWidth);tmp.width=w;tmp.height=h;tx.drawImage(v,0,0,w,h);
   let txt=null;if('BarcodeDetector' in window){try{const r=await new BarcodeDetector().detect(tmp);if(r[0])txt=r[0].rawValue+'  ('+r[0].format+')'}catch(e){}}
   if(!txt){const c=jsQR(tx.getImageData(0,0,w,h).data,w,h);if(c)txt=c.data}
   if(txt){out.innerHTML='';const isU=/^https?:\/\//.test(txt);if(isU){const a=document.createElement('a');a.href=txt.split('  (')[0];a.target='_blank';a.textContent=txt;out.append('Znaleziono: ',a)}else out.textContent='Znaleziono: '+txt;if(navigator.vibrate)navigator.vibrate(60)}}
  else if(mode==='col'){tmp.width=tmp.height=10;tx.drawImage(v,v.videoWidth/2-10,v.videoHeight/2-10,20,20,0,0,10,10);const d=tx.getImageData(0,0,10,10).data;let r=0,g=0,b=0;for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2]}r=Math.round(r/100);g=Math.round(g/100);b=Math.round(b/100);
   const hex='#'+[r,g,b].map(n=>n.toString(16).padStart(2,'0')).join('');o.clearRect(0,0,ov.width,ov.height);o.strokeStyle='#fff';o.lineWidth=3;o.strokeRect(ov.width/2-25,ov.height/2-25,50,50);o.fillStyle=hex;o.fillRect(10,ov.height-70,60,60);
   out.innerHTML=`<b style="font-size:26px">${hex.toUpperCase()}</b>  RGB(${r}, ${g}, ${b}) — ${nazwa(r,g,b)}`}
 }catch(e){out.textContent='Błąd: '+e.message}busy=false}
 requestAnimationFrame(loop);
}
function nazwa(r,g,b){const mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mx<50)return'czarny';if(mn>200)return'biały';if(mx-mn<25)return'szary';
 let h=0,d=mx-mn;if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360;
 return h<15?'czerwony':h<40?'pomarańczowy':h<65?'żółty':h<160?'zielony':h<200?'turkusowy':h<255?'niebieski':h<290?'fioletowy':h<340?'różowy':'czerwony'}
ov.onclick=async()=>{if(mode!=='ocr'||!v.videoWidth)return;out.textContent='Czytam tekst… ⏳';
 tmp.width=v.videoWidth;tmp.height=v.videoHeight;tx.drawImage(v,0,0);
 try{if(!ocrW)ocrW=await Tesseract.createWorker('pol+eng');const{data}=await ocrW.recognize(tmp);out.textContent=data.text.trim()||'Nie widzę tekstu.';
  if(data.text.trim()){const b=document.createElement('button');b.textContent='📋 Kopiuj';b.style.cssText='display:block;margin-top:8px;padding:8px 16px;border-radius:14px;border:0';b.onclick=()=>navigator.clipboard.writeText(data.text);out.append(b)}}
 catch(e){out.textContent='Błąd OCR: '+e.message}};
</script></body></html>
