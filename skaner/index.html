<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<title>Żyro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;overflow:hidden;touch-action:none}
#bg{position:fixed;inset:-20%;filter:blur(60px) saturate(140%);will-change:transform}
.orb{position:absolute;border-radius:50%;opacity:.85;mix-blend-mode:screen}
.o1{width:55vmax;height:55vmax;left:5%;top:0;background:radial-gradient(circle,#ff2d55 0,transparent 65%)}
.o2{width:50vmax;height:50vmax;right:0;top:20%;background:radial-gradient(circle,#5e5ce6 0,transparent 65%)}
.o3{width:45vmax;height:45vmax;left:25%;bottom:0;background:radial-gradient(circle,#30d5c8 0,transparent 65%)}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;perspective:1100px}
#card{position:relative;width:min(78vw,340px);aspect-ratio:3/4;border-radius:38px;transform-style:preserve-3d;will-change:transform;
 background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.04));
 box-shadow:0 40px 80px -20px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.25);
 backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%)}
.layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform-style:preserve-3d;pointer-events:none}
#ring{width:62%;aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);transform:translateZ(40px)}
#ring2{width:44%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.2);transform:translateZ(70px)}
#dot{width:26%;aspect-ratio:1;border-radius:50%;transform:translateZ(110px);
 background:radial-gradient(circle at 35% 30%,#fff 0,#e9e9ff 18%,#9b8cff 45%,#3a2fb8 80%);
 box-shadow:0 20px 40px rgba(60,40,200,.55),inset -6px -10px 20px rgba(0,0,0,.35)}
#title{position:absolute;left:0;right:0;bottom:12%;text-align:center;transform:translateZ(60px)}
#title h1{font-size:30px;font-weight:700;letter-spacing:-.02em}
#title p{font-size:13px;opacity:.65;margin-top:4px;letter-spacing:.02em}
#angle{position:absolute;top:9%;left:0;right:0;text-align:center;transform:translateZ(50px);font-variant-numeric:tabular-nums;font-size:13px;opacity:.7;letter-spacing:.08em}
#glare{position:absolute;inset:0;border-radius:38px;pointer-events:none;mix-blend-mode:overlay;
 background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.75),transparent 55%)}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(0,0,0,.35);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:9;transition:opacity .6s ease}
#start button{font:600 17px -apple-system,sans-serif;color:#000;background:#fff;border:0;border-radius:999px;padding:15px 34px;box-shadow:0 10px 30px rgba(255,255,255,.2);transition:transform .2s}
#start button:active{transform:scale(.95)}
#start p{opacity:.6;font-size:14px}
#hint{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:12px;opacity:.45}
</style>
</head>
<body>
<div id="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<div id="stage"><div id="card">
 <div class="layer"><div id="ring"></div></div>
 <div class="layer"><div id="ring2"></div></div>
 <div class="layer"><div id="dot"></div></div>
 <div id="angle">0° · 0°</div>
 <div id="title"><h1>Żyro</h1><p>Przechyl telefon</p></div>
 <div id="glare"></div>
</div></div>
<div id="start"><button id="go">Zacznij</button><p>Animacja reaguje na ruch telefonu</p></div>
<div id="hint">Na komputerze rusz myszką</div>
<script>
const card=document.getElementById('card'),bg=document.getElementById('bg'),glare=document.getElementById('glare'),
dot=document.getElementById('dot'),ang=document.getElementById('angle'),start=document.getElementById('start');
let tx=0,ty=0,x=0,y=0,vx=0,vy=0,base=null;
const K=0.08,D=0.78; // sprężyna jak w iOS
function orient(e){
  if(e.beta==null)return;
  if(!base)base={b:e.beta,g:e.gamma};
  let b=e.beta-base.b,g=e.gamma-base.g;
  tx=Math.max(-1,Math.min(1,g/30));ty=Math.max(-1,Math.min(1,b/30));
}
function mouse(e){const p=e.touches?e.touches[0]:e;tx=(p.clientX/innerWidth)*2-1;ty=(p.clientY/innerHeight)*2-1}
addEventListener('mousemove',mouse);
addEventListener('touchmove',e=>{if(!window._gyro)mouse(e)},{passive:true});
async function go(){
  try{if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){
    const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')throw 0}}catch(e){}
  addEventListener('deviceorientation',e=>{if(e.beta!=null){window._gyro=1;document.getElementById('hint').style.display='none'}orient(e)});
  start.style.opacity=0;setTimeout(()=>start.remove(),600);
  if(navigator.vibrate)navigator.vibrate(8);
}
document.getElementById('go').onclick=go;
card.addEventListener('click',()=>{base=null;card.animate([{scale:1},{scale:.96},{scale:1}],{duration:380,easing:'cubic-bezier(.2,.8,.2,1)'})});
let t0=performance.now();
function loop(t){
  vx=(vx+(tx-x)*K)*D;vy=(vy+(ty-y)*K)*D;x+=vx;y+=vy;
  const breathe=Math.sin((t-t0)/1400)*0.04;
  card.style.transform=`rotateY(${x*18}deg) rotateX(${-y*18}deg) scale(${1+breathe*0.3})`;
  bg.style.transform=`translate3d(${-x*40}px,${-y*40}px,0) rotate(${(t-t0)/400}deg)`;
  glare.style.setProperty('--gx',(50+x*45)+'%');glare.style.setProperty('--gy',(30+y*45)+'%');
  dot.style.transform=`translateZ(110px) translate(${x*28}px,${y*28}px)`;
  ang.textContent=`${Math.round(x*30)}° · ${Math.round(y*30)}°`;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
